name: Bug report
description: Something in the SDK does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: Node.js 22, Bun 1.3, Deno 2, Cloudflare Workers
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the smallest code that shows it. Never paste your API key or webhook secret.
    validations:
      required: true
  - type: input
    id: request
    attributes:
      label: Request id
      description: From `error.requestId`, if there was a response.
